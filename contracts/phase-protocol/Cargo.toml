[package]
name = "phase-protocol"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "28.0.0"
soroban-token-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[package.metadata.phase_cadence]
wasm_target = "wasm32-unknown-unknown"
soroban_sdk_major = 22
soroban_abi_version = 22000
stellar_cli_version = "23.0.0"

