name: Secret rotation check

on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

jobs:
  rotation-status:
    name: Check API key rotation age
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify dependency cadence alignment
        run: npm run deps:cadence
      - name: Check rotation metadata
        run: npm run security:secret-rotation
        env:
          SECRET_ROTATION_KEYS: CLASSIC_LIQ_ISSUER_SECRET,FAUCET_DISTRIBUTOR_SECRET_KEY,GOOGLE_GENERATIVE_AI_API_KEY
          SECRET_ROTATION_MAX_AGE_DAYS: 90
          SECRET_ROTATION_GRACE_DAYS: 14
          CLASSIC_LIQ_ISSUER_SECRET_ROTATED_AT: ${{ vars.CLASSIC_LIQ_ISSUER_SECRET_ROTATED_AT }}
          FAUCET_DISTRIBUTOR_SECRET_KEY_ROTATED_AT: ${{ vars.FAUCET_DISTRIBUTOR_SECRET_KEY_ROTATED_AT }}
          GOOGLE_GENERATIVE_AI_API_KEY_ROTATED_AT: ${{ vars.GOOGLE_GENERATIVE_AI_API_KEY_ROTATED_AT }}