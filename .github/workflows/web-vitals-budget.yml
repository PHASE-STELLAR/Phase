name: Web Vitals Budget Check

# phase-213 — real RUM ingest + PR-blocking budget gate.
# The phase-160 workflow only echoed static thresholds; this one evaluates
# recorded closed-label field data and fails on configured regressions.
#
# Rollback: unset FEATURE_PHASE_213 (GitHub variable). The job is skipped and
# the evaluator is a no-op, so no vitals are collected or evaluated.

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/**"
      - "tests/fixtures/**"
      - ".github/workflows/web-vitals-budget.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  web-vitals:
    name: Evaluate per-route field data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      vars.FEATURE_PHASE_213 == '1' || vars.FEATURE_PHASE_213 == 'true' ||
      vars.FEATURE_PHASE_213 == 'yes' || vars.FEATURE_PHASE_213 == 'on'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Evaluate recorded field data against per-route budgets
        id: evaluate
        continue-on-error: true
        env:
          FEATURE_PHASE_213: ${{ vars.FEATURE_PHASE_213 }}
        run: |
          npx tsx scripts/evaluate-web-vitals.ts \
            --field tests/fixtures/rum-field-data.json \
            --baseline tests/fixtures/rum-baseline.json \
            --out .artifacts/vitals

      - name: Comment deltas on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = '.artifacts/vitals/vitals-summary.md';
            const marker = '## Web Vitals budget (phase-213)';
            const body = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : `${marker}\n\nNo field data was evaluated (flag off or evaluator error).`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Block the gate on a configured regression
        if: steps.evaluate.outcome == 'failure'
        run: |
          echo "::error::web-vitals budget regression detected — see the PR comment"
          exit 1
