name: Dependency vulnerability audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/package.json"
      - "scripts/package-lock.json"
      - "contracts/**/Cargo.toml"
      - "contracts/**/Cargo.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/package.json"
      - "scripts/package-lock.json"
      - "contracts/**/Cargo.toml"
      - "contracts/**/Cargo.lock"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480e578c10c5467531ea5f2 # v4.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify grouped Soroban and Stellar dependency parity
        run: npm run deps:cadence
      - name: Scan dependencies for high severity vulnerabilities
        run: npm run security:audit